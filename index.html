<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이종원 포트폴리오</title>
    <meta name="description" content="개발자 이종원의 포트폴리오입니다." />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="이종원 포트폴리오" />
    <meta property="og:description" content="개발자 이종원의 포트폴리오입니다." />
    <meta property="og:url" content="https://sisu-01.github.io/" />
    <meta property="og:image" content="https://sisu-01.github.io/og-image.png" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', systemPrefersDark ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
